<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png"><meta name="theme-color" content="#061d5c">
<title>Sequence Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: the construction sub-team's planning board, practical and calm
   IDEA: an erection drawing that fills in stage by stage
   PICTURE: the bridge on its site in 3D, built pieces solid, the rest ghosted
   COLOUR/TYPE: same navy, steel and maple as the builder; Archivo and Inter
   LAYOUT: 3D view left with the stage scrubber under it, the sequence panel right */

/* VOICE: a shop-floor engineering tool, clear and quiet
   IDEA: a fabrication drawing: sticks become members, nodes become bolted joints
   PICTURE: the live 3D bridge, coloured by member, joints as bolt dots
   COLOUR/TYPE: UBC navy, steel grey, maple accent; Archivo headings, Inter text
   LAYOUT: 3D view fills the left, a step panel on the right, stacked on phones */
:root{color-scheme:light dark;--bg:light-dark(#eef1f6,#0b1222);--panel:light-dark(#ffffff,#121b30);--card:light-dark(#f6f8fb,#18233d);--ink:light-dark(#0f1a33,#e6ebf5);--muted:light-dark(#5b6782,#9aa6c0);--line:light-dark(#d5dbe6,#26324d);--navy:#061d5c;--maple:#d6322f;--steel:#808080;--hat:light-dark(#061d5c,#8fb2ff);--accent:#d6322f;--ok:light-dark(#1d7a46,#5fd08f);--warn:light-dark(#b25d00,#ffb057);--view:light-dark(#dfe5ee,#0a1020)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--hat)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hat);outline-offset:2px}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input,select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;min-height:34px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{font:800 20px/1.1 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
header .src{font:500 12px 'JetBrains Mono',monospace;opacity:.75}
.steps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.steps button{background:transparent;color:#cfd8ee;border-color:#2a3f7a;font-weight:600;font-size:13px}
.steps button[aria-selected=true]{background:#fff;color:var(--navy);border-color:#fff}
.steps b{font-family:'JetBrains Mono',monospace;margin-right:5px}
.view{position:relative;background:var(--view)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:14px;bottom:12px;right:14px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.chip b{font-family:'JetBrains Mono',monospace}
.viewbtns{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.viewbtns button{background:var(--panel);font-size:12.5px;min-height:32px;padding:5px 10px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12.5px;display:none;white-space:nowrap;z-index:3}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}
aside h2{font:800 22px/1.15 Archivo,sans-serif;margin:0 0 4px}
aside h3{font:700 14px Archivo,sans-serif;margin:18px 0 6px}
.lead{color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);flex:1 1 110px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--card)}
.drop.over{border-color:var(--hat);color:var(--ink)}
.drop strong{display:block;color:var(--ink);font:700 15px Archivo,sans-serif;margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
.stats b{display:block;font:800 20px/1.1 Archivo,sans-serif;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.item{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--card);cursor:pointer}
.item.sel{border-color:var(--hat);box-shadow:0 0 0 1px var(--hat) inset}
.item .sw{width:14px;height:14px;border-radius:3px}
button[aria-pressed=true]{box-shadow:0 0 0 2px var(--hat)}
.item .nm{font-weight:600}.item small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.flag{font:600 11px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:5px;white-space:nowrap}
.flag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.flag.bad{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.edit{border:1px solid var(--hat);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--card)}
.edit .row label{flex:1 1 90px}
.note{font-size:12.5px;color:var(--muted)}
.msg{font-size:13px;margin:8px 0;min-height:1em}
.msg.err{color:var(--accent)}
textarea{width:100%;min-height:120px;font:12px 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px}
details summary{cursor:pointer;font-weight:600}

#plan{position:absolute;inset:0;background:var(--view);z-index:2}
#plan svg{display:block}#plan .pl{font:600 12px Inter,sans-serif;fill:#1d2640}#plan .pd{font:500 11px 'JetBrains Mono',monospace;fill:var(--ink)}
.view.withref #plan{bottom:48%}
#refBox{position:absolute;left:0;right:0;bottom:0;height:48%;z-index:3;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
#refBox[hidden]{display:none}
.refbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}.refbar button{min-height:30px;padding:3px 10px}
#refNav{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}#refNav[hidden]{display:none}
.refscroll{flex:1;overflow:auto;display:grid;place-items:center;padding:10px}.refscroll img{max-width:100%;max-height:100%;transform-origin:center;transition:transform .15s}
.srow{display:grid;grid-template-columns:12px minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:6px}
.srow .sw{grid-row:span 2;align-self:stretch;height:auto!important}.srow input[data-f=name]{grid-column:2}.srow .wl{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}.srow .sbtn{grid-column:4;grid-row:1/3;flex-direction:column;align-self:center}
.srow .sw{width:12px;height:28px;border-radius:3px}.srow input,.srow select{min-height:32px;padding:4px 6px;font-size:13px}
.sbtn{display:flex;gap:3px}.sbtn button{min-height:32px;padding:2px 8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--card)}
.frow label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}.frow input{min-height:32px;padding:4px 6px;font-size:13px}
.frow .fname{font-weight:600}.frow label:nth-of-type(odd){grid-column:1}.frow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.frow .fname{grid-column:1}.frow [data-fdel]{grid-column:2;justify-self:end;min-height:32px}
.chk{font-size:13px;display:flex;gap:8px;align-items:baseline}

@media (max-width:820px){ body{overflow:auto} .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 56vh auto} aside{border-left:0;border-top:1px solid var(--line)} .steps{margin-left:0} }

.scrub{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;z-index:2}
.scrub input[type=range]{flex:1;accent-color:var(--navy);min-height:28px}
.scrub b{font:700 13px 'JetBrains Mono',monospace;white-space:nowrap;min-width:9ch;text-align:right}
.scrub button{min-height:32px;padding:4px 10px}.scrub select{min-height:32px;font-size:12.5px}#sPlay{min-width:72px}
@media (max-width:600px){ #sSpeed{display:none} }
.legend{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:62%}
.legend .chip{line-height:1.4}.legend label{white-space:nowrap}
.stage{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:9px 11px;margin-bottom:8px}
.stage.on{border-color:var(--hat);box-shadow:0 0 0 1px var(--hat) inset}
.stage .sh{display:flex;gap:8px;align-items:center}
.stage .sn{font:700 12px 'JetBrains Mono',monospace;color:var(--muted)}
.stage input.nm{flex:1;font-weight:600;border-color:transparent;background:transparent;padding:4px 6px}
.stage input.nm:focus{border-color:var(--line);background:var(--panel)}
.lift{border:1px dashed var(--line);border-radius:9px;padding:6px 8px;margin-top:6px;background:var(--panel)}
.lift.on{border-style:solid;border-color:var(--hat)}
.lift .lh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:6px}
.pcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 8px;font-size:12.5px;background:var(--card);white-space:nowrap}
.pc i{width:9px;height:9px;border-radius:2px;display:inline-block}
.pc button{min-height:22px;padding:0 6px;border:0;background:transparent;font-size:13px}
.mini{min-height:28px;padding:2px 9px;font-size:12.5px}
.pool{display:flex;flex-wrap:wrap;gap:5px;max-height:260px;overflow:auto;padding:2px}
.pool button{font-size:12.5px;min-height:28px;padding:2px 9px;display:inline-flex;gap:5px;align-items:center}
.pool button i{width:9px;height:9px;border-radius:2px;display:inline-block}
.issues{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px}
.issues li{color:var(--warn)}
.tabs2{display:flex;gap:6px;margin:0 0 12px}
.tabs2 button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* brand bar: the UBC Steel Bridge logo on white, a maple-red top edge and a navy rule */
header{background:#fff;color:var(--navy);border-top:3px solid var(--maple);border-bottom:3px solid var(--navy);padding:8px 18px}
.brandlogo{height:40px;width:auto;display:block}
.bt{display:flex;flex-direction:column;gap:1px;padding-left:14px;border-left:1px solid #d5dbe6}
.bt .team{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#6d6d6d;text-transform:uppercase}
header h1{color:var(--navy)}
header .src{color:#6d6d6d;opacity:1}
.steps button{background:transparent;color:var(--navy);border-color:#cfd6e3}
.steps button:hover{border-color:var(--navy)}
.steps button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:600px){ .brandlogo{height:30px} .bt{padding-left:10px} .bt .team{display:none} }

<script>{
// ================= state =================
// BR: the bridge file from the Bridge Model Builder. SEQ: {stages:[{name,lifts:[{items:[pieceKey]}]}]}
const KEY='seq-studio-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ftin=v=>{ const neg=v<0; v=Math.abs(Math.round(v*4)/4); const f=Math.floor(v/12), i=+(v-f*12).toFixed(2); return (neg?'−':'')+f+'′-'+i+'″'; };
let BR=null, SEQ={stages:[]}, PIECES=[], PK={}, act={s:-1,l:-1}, view=0, hist=[], ghosts=true;
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({bridge:BR,seq:SEQ})); }catch(e){} };
const snap=()=>{ hist.push(JSON.stringify(SEQ)); if(hist.length>80) hist.shift(); };
const undo=()=>{ if(!hist.length) return; SEQ=JSON.parse(hist.pop()); fixAct(); save(); render(); };

// ================= geometry: the bridge file placed on its site =================
const SKCOL={yard:'#c9b37e',zone:'#9fc79a',bank:'#d8c49a',river:'#7fb6dc',road:'#9aa0a8',transport:'#c7ccd6',other:'#e2e2e2'};
const site=()=>BR.site||{bx:0,bz:0,rot:0,strips:[],footings:[],depth:0};
let GROUND=0;
function P3(x,y,l){ const S=site(), lx=x+(l==='S'?(BR.skew||0):0), lz=(l==='N'?-1:1)*BR.spacing/2, r=(S.rot||0)*Math.PI/180;
  return new THREE.Vector3((S.bx||0)+lx*Math.cos(r)-lz*Math.sin(r), y-GROUND, (S.bz||0)+lx*Math.sin(r)+lz*Math.cos(r)); }
function buildPieces(){
  const N=BR.nodes, sup=Object.keys(N).filter(n=>N[n].sup); GROUND=sup.length?Math.min(...sup.map(n=>N[n].y)):Math.min(...Object.values(N).map(n=>n.y));
  const stick=id=>BR.sticks.find(s=>s.id===id); PIECES=[];
  for(const m of BR.members) for(const l of ['N','S']) PIECES.push({key:m.id+'|'+l,name:m.name+' '+l,color:m.color,kind:m.kind||'Member',
    segs:m.sticks.map(id=>{ const s=stick(id); return [P3(N[s.a].x,N[s.a].y,l),P3(N[s.b].x,N[s.b].y,l)]; })});
  for(const c of (BR.cross||[])){ const a=P3(N[c.a.n].x,N[c.a.n].y,c.a.l), b=P3(N[c.b.n].x,N[c.b.n].y,c.b.l), m=a.clone().lerp(b,0.5);
    if(c.half){ PIECES.push({key:c.id+'|A',name:c.name+'A',color:c.color,kind:'Cross',segs:[[a,m]]}); PIECES.push({key:c.id+'|B',name:c.name+'B',color:c.color,kind:'Cross',segs:[[m,b]]}); }
    else PIECES.push({key:c.id+'|X',name:c.name,color:c.color,kind:'Cross',segs:[[a,b]]}); }
  PK={}; PIECES.forEach(p=>PK[p.key]=p);
}
const placedAt=()=>{ const at={}; SEQ.stages.forEach((st,k)=>st.lifts.forEach(L=>L.items.forEach(i=>at[i]=k))); return at; };

// ================= 3D =================
const cv=$('cv'), renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true}); renderer.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,1,1,40000), controls=new THREE.OrbitControls(camera,cv); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,0.95)); const sun=new THREE.DirectionalLight(0xffffff,0.5); sun.position.set(300,600,400); scene.add(sun);
const SITE=new THREE.Group(), BRG=new THREE.Group(); scene.add(SITE,BRG); const boxGeo=new THREE.BoxGeometry(1,1,1); let pickables=[], ctr=new THREE.Vector3(), ext=200;
function drawSite(){ while(SITE.children.length) SITE.remove(SITE.children[0]); const S=site(); if(!S.strips||!S.strips.length) return;
  const wS=s=>s.wS??s.w, edge=(k,south)=>S.strips.slice(0,k).reduce((a,s)=>a+(south?wS(s):s.w),0), zN=-S.depth/2, zS=S.depth/2;
  S.strips.forEach((s,k)=>{ const sh=new THREE.Shape(); sh.moveTo(edge(k,0),-zN); sh.lineTo(edge(k+1,0),-zN); sh.lineTo(edge(k+1,1),-zS); sh.lineTo(edge(k,1),-zS); sh.lineTo(edge(k,0),-zN);
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:SKCOL[s.kind]||SKCOL.other,side:THREE.DoubleSide})); m.rotation.x=-Math.PI/2; m.position.y=-0.6; SITE.add(m);
    const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(edge(k,0),-0.5,zN),new THREE.Vector3(edge(k,1),-0.5,zS)]),new THREE.LineBasicMaterial({color:0x2b3550})); SITE.add(ln); });
  for(const f of S.footings||[]){ const m=new THREE.Mesh(boxGeo,new THREE.MeshLambertMaterial({color:0x8a7550})); m.scale.set(f.len,1,f.wid); m.position.set(f.x+f.len/2,-0.1,f.zo); m.rotation.y=-(f.rot||0)*Math.PI/180; SITE.add(m); }
  if(!labels) return;
  // strip names painted on the ground, along the strip when it is narrow; widths along the south edge; footing names beside each footing
  S.strips.forEach((s,k)=>{ const a0=edge(k,0), a1=edge(k+1,0), b0=edge(k,1), b1=edge(k+1,1), w=Math.min(a1-a0,b1-b0), cx=(a0+a1+b0+b1)/4;
    const ang=Math.atan2((b0+b1)/2-(a0+a1)/2,S.depth);   // lean of an angled strip
    const across=w>=S.depth*0.9||w>=s.name.length*6; const lab=groundText([s.name.toUpperCase()],'#1d2640');
    let L=across?Math.min(w*0.6,s.name.length*5):Math.min(S.depth*0.6,s.name.length*5), H=L/lab.aspect; if(!across&&H>w*0.42){ H=w*0.42; L=H*lab.aspect; } if(across&&H>S.depth*0.18){ H=S.depth*0.18; L=H*lab.aspect; }
    lab.mesh.scale.set(L,H,1); lab.group.position.set(cx,-0.5,0); lab.group.rotation.y=across?0:Math.PI/2-ang; SITE.add(lab.group);
    const ws=s.wS??s.w, dl=groundText([ftin(s.w)+(ws!==s.w?' N / '+ftin(ws)+' S':'')],'#2b3550'); const dh=Math.min(5,Math.max(2.5,w*0.09)); dl.mesh.scale.set(dh*dl.aspect,dh,1);
    if(dh*dl.aspect<w*1.05){ dl.group.position.set((b0+b1)/2,-0.5,S.depth/2-dh*0.9); SITE.add(dl.group); } });
  for(const f of S.footings||[]){ if(!f.name) continue; const t=groundText([f.name],'#4b3b1c'), hh=Math.min(5,Math.max(3.5,f.wid*0.2)); t.mesh.scale.set(hh*t.aspect,hh,1); t.group.position.set(f.x+f.len/2,-0.5,f.zo+f.wid/2+hh*0.9); SITE.add(t.group); }
}
let labels=true;
function groundText(lines,color){ const c=document.createElement('canvas'), x=c.getContext('2d'), fs=64; x.font=`700 ${fs}px Inter, system-ui, sans-serif`;
  const w=Math.ceil(Math.max(...lines.map(l=>x.measureText(l).width)))+24, h=Math.ceil(fs*1.25*lines.length)+12; c.width=w; c.height=h;
  x.font=`700 ${fs}px Inter, system-ui, sans-serif`; x.fillStyle=color; x.textBaseline='middle'; x.textAlign='center'; lines.forEach((l,i)=>x.fillText(l,w/2,6+fs*1.25*(i+0.5)));
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.5,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1}));
  mesh.rotation.x=-Math.PI/2; const group=new THREE.Group(); group.add(mesh); return {group,mesh,aspect:w/h}; }
function drawBridge(){ while(BRG.children.length){ const o=BRG.children.pop(); if(o.material) o.material.dispose(); } pickables=[]; if(!BR) return;
  const at=placedAt(), h=BR.hss.b, act0=act.s>=0&&SEQ.stages[act.s]?new Set(SEQ.stages[act.s].lifts.flatMap(L=>L.items)):new Set();
  for(const p of PIECES){ const k=at[p.key], built=k!==undefined&&k<view, now=k!==undefined&&k===view-1, inAct=act0.has(p.key);
    if(!built&&!ghosts&&!inAct) continue;
    const mat=built?new THREE.MeshLambertMaterial({color:now?'#ffcc33':p.color,emissive:new THREE.Color(now?'#5a4300':0)})
      :new THREE.MeshLambertMaterial({color:inAct?'#ffcc33':p.color,transparent:true,opacity:inAct?0.75:0.13,depthWrite:false});
    for(const [a,b] of p.segs){ const d=b.clone().sub(a), l=d.length(); if(l<0.01) continue; const m=new THREE.Mesh(boxGeo,mat); m.scale.set(l,h,h); m.position.copy(a).add(b).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),d.normalize()); m.userData={piece:p.key}; BRG.add(m); pickables.push(m); } }
}
function measure(){ const pts=PIECES.flatMap(p=>p.segs.flat()), S=site(); const xs=pts.map(p=>p.x), zs=pts.map(p=>p.z);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(S.strips&&S.strips.length){ x0=Math.min(x0,0); x1=Math.max(x1,S.strips.reduce((a,s)=>a+Math.max(s.w,s.wS??s.w),0)); }
  ctr.set((Math.min(...xs)+Math.max(...xs))/2,10,(Math.min(...zs)+Math.max(...zs))/2); ext=Math.max(Math.max(...xs)-Math.min(...xs),60); }
function fit(mode){ const d=ext*1.1; controls.target.copy(ctr);
  if(mode==='elev') camera.position.set(ctr.x,ctr.y+d*0.05,ctr.z+d*1.3); else if(mode==='plan') camera.position.set(ctr.x,ctr.y+d*1.5,ctr.z+0.01); else camera.position.set(ctr.x-d*0.5,ctr.y+d*0.6,ctr.z+d*1.15);
  camera.near=d/300; camera.far=d*30; camera.updateProjectionMatrix(); controls.update(); }
$('vElev').onclick=()=>fit('elev'); $('vIso').onclick=()=>fit('iso'); $('vPlan').onclick=()=>fit('plan');
function resize(){ const r=cv.parentElement.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv.parentElement);
(function loop(){ controls.update(); const bg=getComputedStyle(cv.parentElement).backgroundColor; renderer.setClearColor(new THREE.Color(/rgba\(0, 0, 0, 0\)/.test(bg)?'#dfe5ee':bg)); renderer.render(scene,camera); requestAnimationFrame(loop); })();
const ray=new THREE.Raycaster(), mv=new THREE.Vector2(); let down=null;
const hit=e=>{ const r=cv.getBoundingClientRect(); mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(mv,camera); const h=ray.intersectObjects(pickables)[0]; return h&&h.object.userData.piece; };
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{ if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return; const k=hit(e); if(!k) return; const at=placedAt();
  if(at[k]!==undefined){ act={s:at[k],l:SEQ.stages[at[k]].lifts.findIndex(L=>L.items.includes(k))}; render(); return; } addPiece(k); });
cv.addEventListener('pointermove',e=>{ const t=$('tip'), k=BR&&hit(e); if(!k){ t.style.display='none'; return; } const at=placedAt(), r=cv.getBoundingClientRect();
  t.textContent=PK[k].name+(at[k]!==undefined?' · stage '+(at[k]+1):' · not placed yet'); t.style.display='block'; t.style.left=(e.clientX-r.left+12)+'px'; t.style.top=(e.clientY-r.top+12)+'px'; });
cv.addEventListener('pointerleave',()=>$('tip').style.display='none');

// ================= editing =================
function fixAct(){ if(act.s>=SEQ.stages.length) act.s=SEQ.stages.length-1; if(act.s<0){ act.l=-1; return; } const n=SEQ.stages[act.s].lifts.length; if(act.l>=n) act.l=n-1; }
function addPiece(k){ snap(); if(act.s<0){ SEQ.stages.push({name:'',lifts:[{items:[]}]}); act={s:SEQ.stages.length-1,l:0}; }
  const st=SEQ.stages[act.s]; if(act.l<0){ st.lifts.push({items:[]}); act.l=st.lifts.length-1; } st.lifts[act.l].items.push(k); view=Math.max(view,act.s+1); save(); render(); }
function stageName(st,k){ return st.name||st.lifts.flatMap(L=>L.items).map(i=>PK[i]?PK[i].name:i).slice(0,3).join(' + ')||'Stage '+(k+1); }
function issues(st){ const out=[]; st.lifts.forEach((L,j)=>{ if(!L.items.length) out.push(`Lift ${j+1} is empty.`); if(L.items.length>3) out.push(`Lift ${j+1} has ${L.items.length} pieces: an assembly is at most three members.`); });
  if(!st.lifts.length) out.push('This stage has no lifts.'); return out; }

// ================= panel =================
const P=$('panel'); let tab='seq';
const KORDER=['Pier','Bottom','Top','Diag','Post','Cantilever','Cross','Member'];
function render(){
  $('srcName').textContent=BR?BR.name:''; fixAct(); view=Math.min(view,SEQ.stages.length); $('sRange').max=SEQ.stages.length; $('sRange').value=view;
  $('sLbl').textContent=view?`Stage ${view} of ${SEQ.stages.length}`:'Site only'; drawBridge();
  const at=placedAt(), placed=PIECES.filter(p=>at[p.key]!==undefined).length;
  $('legend').innerHTML=BR?`<span class="chip">${placed} of ${PIECES.length} pieces placed</span><span class="chip">${SEQ.stages.length} stages</span><span class="chip"><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="gh" ${ghosts?'checked':''}> Show unbuilt pieces</label></span>${(site().strips||[]).length?`<span class="chip"><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="lb" ${labels?'checked':''}> Site labels</label></span>`:''}`:'';
  if($('gh')) $('gh').onchange=e=>{ ghosts=e.target.checked; drawBridge(); };
  if($('lb')) $('lb').onchange=e=>{ labels=e.target.checked; drawSite(); };
  if(!BR){ P.innerHTML=`<h2>Open a bridge file</h2><p class="lead">Export a bridge file from the Bridge Model Builder (step 6), then open it here.</p><div class="row"><button class="primary" id="open2">Open bridge file</button></div>`; $('open2').onclick=()=>$('bfile').click(); return; }
  P.innerHTML=`<div class="tabs2" role="tablist"><button role="tab" aria-selected="${tab==='seq'}" data-t="seq">Sequence</button><button role="tab" aria-selected="${tab==='br'}" data-t="br">Bridge &amp; site</button></div><div id="tabBody"></div>`;
  P.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; render(); });
  (tab==='seq'?viewSeq:viewBridge)($('tabBody'),at,placed);
}
function viewSeq(el,at,placed){
  const pool=PIECES.filter(p=>at[p.key]===undefined), groups={}; pool.forEach(p=>(groups[p.kind]=groups[p.kind]||[]).push(p));
  const kinds=Object.keys(groups).sort((a,b)=>(KORDER.indexOf(a)+99)%99-(KORDER.indexOf(b)+99)%99||a.localeCompare(b));
  const chip=k=>{ const p=PK[k]; return `<span class="pc"><i style="background:${p?p.color:'#999'}"></i>${esc(p?p.name:k)}<button data-rm="${esc(k)}" aria-label="Remove ${esc(p?p.name:k)}">×</button></span>`; };
  el.innerHTML=`<h2>Build the sequence</h2><p class="lead">Each stage holds up to three lifts, and each lift is one member or a yard assembly of up to three. Pick a lift, then click pieces in the view or in the list below. Timing and stability checks come next.</p>
  <div class="row"><button class="primary" id="addSt">Add a stage</button><button id="undoB" ${hist.length?'':'disabled'}>Undo</button></div>
  ${SEQ.stages.map((st,k)=>{ const iss=issues(st); return `<div class="stage ${k===act.s?'on':''}" data-st="${k}"><div class="sh"><span class="sn">${String(k+1).padStart(2,'0')}</span><input class="nm" data-nm="${k}" value="${esc(st.name)}" placeholder="${esc(stageName({lifts:st.lifts},k))}" aria-label="Stage name">
    <button class="mini" data-up="${k}" ${k?'':'disabled'} aria-label="Move up">↑</button><button class="mini" data-dn="${k}" ${k<SEQ.stages.length-1?'':'disabled'} aria-label="Move down">↓</button><button class="mini" data-del="${k}" aria-label="Delete stage">×</button></div>
    ${st.lifts.map((L,j)=>`<div class="lift ${k===act.s&&j===act.l?'on':''}" data-lift="${k},${j}"><div class="lh"><span>Lift ${j+1}${L.items.length>1?' · yard assembly':''}</span><button class="mini" data-dl="${k},${j}" aria-label="Delete lift">Remove lift</button></div><div class="pcs">${L.items.map(chip).join('')||'<span class="note">Click pieces to add them.</span>'}</div></div>`).join('')}
    ${st.lifts.length<3?`<button class="mini" data-al="${k}" style="margin-top:6px">Add a lift</button>`:''}
    ${iss.length?`<ul class="issues">${iss.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`; }).join('')}
  <h3>Pieces not placed yet (${pool.length})</h3>${pool.length?kinds.map(k=>`<div class="note" style="margin-top:8px">${esc(k)}</div><div class="pool">${groups[k].map(p=>`<button data-add="${p.key}"><i style="background:${p.color}"></i>${esc(p.name)}</button>`).join('')}</div>`).join(''):'<p class="note"><span class="flag ok">every piece is placed</span></p>'}
  <h3>Sequence file</h3><div class="row"><button id="expS">Copy sequence JSON</button><button id="impS">Paste a sequence</button><button id="clrS">Clear the sequence</button></div><div class="msg" id="smsg"></div><textarea id="sta" hidden placeholder="Paste sequence JSON here, then press Paste a sequence again"></textarea>`;
  el.querySelectorAll('[data-st]').forEach(d=>d.addEventListener('click',e=>{ if(e.target.closest('button,input')) return; const k=+d.dataset.st; if(act.s!==k){ act={s:k,l:SEQ.stages[k].lifts.length?0:-1}; view=k+1; render(); } }));
  el.querySelectorAll('[data-lift]').forEach(d=>d.addEventListener('click',e=>{ if(e.target.closest('button')) return; const [k,j]=d.dataset.lift.split(',').map(Number); act={s:k,l:j}; view=Math.max(view,k+1); render(); }));
  el.querySelectorAll('[data-nm]').forEach(i=>i.onchange=()=>{ snap(); SEQ.stages[+i.dataset.nm].name=i.value.trim(); save(); render(); });
  const mv=(k,d)=>{ snap(); const a=SEQ.stages; [a[k],a[k+d]]=[a[k+d],a[k]]; act={s:k+d,l:0}; save(); render(); };
  el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1)); el.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ snap(); SEQ.stages.splice(+b.dataset.del,1); save(); render(); });
  el.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{ snap(); const k=+b.dataset.al; SEQ.stages[k].lifts.push({items:[]}); act={s:k,l:SEQ.stages[k].lifts.length-1}; save(); render(); });
  el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{ snap(); const [k,j]=b.dataset.dl.split(',').map(Number); SEQ.stages[k].lifts.splice(j,1); save(); render(); });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ snap(); const key=b.dataset.rm; SEQ.stages.forEach(st=>st.lifts.forEach(L=>L.items=L.items.filter(i=>i!==key))); save(); render(); });
  el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addPiece(b.dataset.add));
  $('addSt').onclick=()=>{ snap(); const k=act.s>=0?act.s+1:SEQ.stages.length; SEQ.stages.splice(k,0,{name:'',lifts:[{items:[]}]}); act={s:k,l:0}; view=k+1; save(); render(); };
  $('undoB').onclick=undo;
  $('expS').onclick=async()=>{ const t=JSON.stringify({bridge:BR.name,stages:SEQ.stages},null,1); try{ await navigator.clipboard.writeText(t); $('smsg').textContent='Copied.'; }catch(e){ const a=$('sta'); a.hidden=false; a.value=t; a.select(); $('smsg').textContent='Copy it from the box below.'; } };
  $('impS').onclick=()=>{ const a=$('sta'); if(a.hidden||!a.value.trim()){ a.hidden=false; a.value=''; a.focus(); $('smsg').textContent='Paste the JSON into the box, then press “Paste a sequence” again.'; return; }
    try{ const d=JSON.parse(a.value); if(!Array.isArray(d.stages)) throw new Error('No stages in that JSON.'); const bad=d.stages.flatMap(s=>s.lifts.flatMap(L=>L.items)).filter(k=>!PK[k]);
      if(bad.length) throw new Error(`${bad.length} pieces in it aren’t in this bridge.`); snap(); SEQ={stages:d.stages}; act={s:0,l:0}; view=SEQ.stages.length; save(); render(); }catch(e){ $('smsg').textContent=e.message; } };
  $('clrS').onclick=e=>{ const b=e.currentTarget; if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Clear it? Press again'; setTimeout(()=>{ b.dataset.c=''; b.textContent='Clear the sequence'; },2500); return; } snap(); SEQ={stages:[]}; act={s:-1,l:-1}; view=0; save(); render(); };
}
function viewBridge(el){ const S=site(), J=BR.joints||{}, C=BR.cross||[];
  const bolts=Object.values(J).reduce((a,j)=>a+j.bolts,0)*2+C.reduce((a,c)=>a+c.ends[0].bolts+c.ends[1].bolts+(c.half?c.mid.bolts:0)+(c.xg&&C.find(q=>q.xg===c.xg)===c?c.xBolts:0),0);
  el.innerHTML=`<h2>${esc(BR.name)}</h2><p class="lead">From the Bridge Model Builder. To change members, joints or the site, edit them there, export again and open the new file here.</p>
  <div class="stats"><div><b>${PIECES.length}</b>pieces</div><div><b>${Object.keys(J).length*2}</b>truss joints</div><div><b>${bolts}</b>bolts</div></div>
  <h3>Site${S.name?': '+esc(S.name):''}</h3><div class="row"><button id="openS2">Open a different site</button></div>${S.strips&&S.strips.length?`<div class="list">${S.strips.map(s=>`<div class="item" style="cursor:default"><span class="sw" style="background:${SKCOL[s.kind]||SKCOL.other}"></span><span class="nm">${esc(s.name)}<small>${ftin(s.w)}${s.wS!=null&&s.wS!==s.w?' north, '+ftin(s.wS)+' south':''}</small></span><span></span></div>`).join('')}</div>
  <p class="note">${(S.footings||[]).length} footings · site ${ftin(S.depth)} wide${S.starter?' · <span class="flag bad">still the starter layout</span>':''}</p>
  <h3>Where the bridge sits</h3><div class="row"><label>West end from the site’s west edge<input id="pbx" value="${ftin(S.bx||0)}"></label><label>Centreline offset (N −, S +)<input id="pbz" value="${ftin(S.bz||0)}"></label></div>
  <div class="row"><label>Rotation in plan (°)<input id="prot" value="${S.rot||0}" inputmode="decimal"></label><label>South truss shifted east by<input id="pskew" value="${ftin(BR.skew||0)}"></label></div>
  <div class="row"><button id="pfit">Fit the piers to the footings</button></div><p class="note">Lengths take 7'-6", 7.5' or 90"; a plain number means feet.</p>`:'<p class="note">This bridge file has no site. Set one up in the builder’s Site step.</p>'}
  <h3>Truss</h3><p class="note">Lines ${ftin(BR.spacing)} apart${BR.skew?`, south truss shifted ${ftin(BR.skew)}`:''} · HSS ${BR.hss.b}″ square · ${BR.members.length} members per line, ${C.length} cross members</p>`;
  $('openS2').onclick=()=>$('sfile').click(); if(!$('pbx')) return;
  const len=(id,cb)=>{ $(id).onchange=e=>{ const v=parseLen(e.target.value); if(!isFinite(v)){ e.target.setCustomValidity('Use 7\'-6", 7.5\' or 90"'); e.target.reportValidity(); return; } cb(v); replace(); }; };
  len('pbx',v=>S.bx=v); len('pbz',v=>S.bz=v); len('pskew',v=>BR.skew=v);
  $('prot').onchange=e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ S.rot=v; replace(); } };
  $('pfit').onclick=()=>{ snapSite(S); replace(); }; }
function parseLen(s){ s=String(s).trim().replace(/[′’]/g,"'").replace(/[″”]/g,'"').replace(/^−/,'-'); if(!s) return NaN;
  let m=s.match(/^(-?)(\d+(?:\.\d+)?)\s*'\s*-?\s*(\d+(?:\.\d+)?)?\s*(?:"|in)?$/i); if(m) return (m[1]?-1:1)*((+m[2])*12+(+(m[3]||0)));
  m=s.match(/^(-?\d+(?:\.\d+)?)\s*(?:"|in)$/i); if(m) return +m[1]; m=s.match(/^-?\d+(?:\.\d+)?$/); if(m) return +s*12; return NaN; }

// ================= scrubber, file open, start =================
// ---------- play: each stage's pieces appear in turn ----------
let playT=null;
const stopPlay=()=>{ if(playT){ clearInterval(playT); playT=null; } $('sPlay').textContent='Play'; };
function tick(){ if(view>=SEQ.stages.length){ stopPlay(); return; } view++; act={s:view-1,l:0}; render(); if(view>=SEQ.stages.length) stopPlay(); }
$('sPlay').onclick=()=>{ if(playT){ stopPlay(); return; } if(!SEQ.stages.length) return; if(view>=SEQ.stages.length){ view=0; act={s:-1,l:-1}; render(); }
  $('sPlay').textContent='Pause'; playT=setInterval(tick,+$('sSpeed').value); };
$('sSpeed').onchange=()=>{ if(playT){ clearInterval(playT); playT=setInterval(tick,+$('sSpeed').value); } };
['sPrev','sNext','sRange'].forEach(id=>$(id).addEventListener('pointerdown',stopPlay));
$('sRange').oninput=e=>{ view=+e.target.value; act.s=view?view-1:-1; act.l=act.s>=0&&SEQ.stages[act.s].lifts.length?0:-1; render(); };
$('sPrev').onclick=()=>{ if(view>0){ view--; act.s=view-1; act.l=0; render(); } }; $('sNext').onclick=()=>{ if(view<SEQ.stages.length){ view++; act.s=view-1; act.l=0; render(); } };
function loadBridge(d,keepSeq){ if(!d||d.format!=='ubc-bridge-model') throw new Error('That isn’t a bridge file from the Bridge Model Builder.');
  BR=d; buildPieces(); if(!keepSeq){ SEQ={stages:[]}; act={s:-1,l:-1}; view=0; hist=[]; } else { const ok=new Set(PIECES.map(p=>p.key)); SEQ.stages.forEach(st=>st.lifts.forEach(L=>L.items=L.items.filter(k=>ok.has(k)))); }
  drawSite(); measure(); fit('iso'); save(); render(); }
$('openB').onclick=()=>$('bfile').click();
// ---------- a construction site file (or the site inside another bridge file), placed under this bridge ----------
function snapSite(S){ const N=BR.nodes, sp=Object.keys(N).filter(n=>N[n].sup); if(!sp.length||!(S.footings||[]).length) return false;
  const xs=sp.map(n=>N[n].x), mid=a=>(Math.min(...a)+Math.max(...a))/2, wx=mid(xs.filter(x=>x<=Math.min(...xs)+48)), ex=mid(xs.filter(x=>x>=Math.max(...xs)-48));
  S.rot=0; S.bz=S.footings.reduce((a,f)=>a+f.zo,0)/S.footings.length;
  const off=l=>{ const zl=S.bz+(l==='N'?-1:1)*BR.spacing/2; let c=S.footings.filter(f=>Math.abs(zl-f.zo)<=f.wid/2+0.01); if(!c.length) c=S.footings;
    const cs=c.map(f=>f.x+f.len/2), w=Math.min(...cs), e=Math.max(...cs); return c.length>1?((w-wx)+(e-ex))/2:(w-wx); };
  const oN=off('N'), oS=off('S'); S.bx=Math.round(oN*4)/4; BR.skew=Math.round((oS-oN)*4)/4; return true; }
function loadSite(d,name){ let s=null, nm=name;
  if(d&&d.format==='ubc-bridge-site'&&d.site){ s=d.site; nm=d.name||name; } else if(d&&d.format==='ubc-bridge-model'&&d.site){ s=d.site; nm=(d.name||name)+' (site)'; }
  if(!s||!Array.isArray(s.strips)) throw new Error('That file has no construction site in it. Save one from the builder’s Site step.');
  const S=JSON.parse(JSON.stringify(s)); S.name=nm; S.starter=false; S.bx=null; S.rot=0; snapSite(S); if(S.bx==null){ S.bx=0; S.bz=0; }
  BR.site=S; replace(); }
function replace(){ buildPieces(); drawSite(); measure(); fit('iso'); save(); render(); }
$('openS').onclick=()=>{ if(!BR) return $('bfile').click(); $('sfile').click(); };
$('sfile').onchange=()=>{ const f=$('sfile').files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ loadSite(JSON.parse(r.result),f.name.replace(/\.json$/i,'').replace(/\.site$/i,'')); tab='br'; render(); }catch(e){ P.insertAdjacentHTML('afterbegin',`<p class="msg err">${esc(e.message)}</p>`); } }; r.readAsText(f); $('sfile').value=''; };
$('bfile').onchange=()=>{ const f=$('bfile').files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); const same=BR&&d.name===BR.name; loadBridge(d,same); }catch(e){ P.insertAdjacentHTML('afterbegin',`<p class="msg err">${esc(e.message)}</p>`); } }; r.readAsText(f); $('bfile').value=''; };
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); } });
resize();
let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
try{ if(saved&&saved.bridge){ SEQ=saved.seq||{stages:[]}; loadBridge(saved.bridge,true); view=SEQ.stages.length; act={s:SEQ.stages.length-1,l:0}; render(); }
  else loadBridge(JSON.parse($('sample').textContent),false); }catch(e){ console.error(e); render(); }
window.__ss={get BR(){ return BR; },get SEQ(){ return SEQ; },camera,cv};
}
</script>
